name: diario_virtual
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.0
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  flutter_native_splash: ^2.4.0
  firebase_auth: ^6.7.0
  google_sign_in: ^6.2.1
  flutter_launcher_icons: ^0.14.4
  firebase_ai: ^4.0.0
  http: ^1.6.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.6
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_local_notifications: ^22.3.2
  url_launcher: ^6.3.3
  local_auth: ^3.0.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/google.png
    - assets/icon.png
    - assets/29.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon_foreground.png"